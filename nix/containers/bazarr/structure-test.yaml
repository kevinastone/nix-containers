# yaml-language-server: $schema=https://json.schemastore.org/container-structure-test.json
schemaVersion: "2.0.0"

metadataTest:
  user: "65532:65532"
  workdir: "/config"
  cmd: ["--no-update", "--config", "/config"]
  exposedPorts: ["6767"]
  volumes: ["/config"]
  envVars:
    - key: "PYTHONDONTWRITEBYTECODE"
      value: "1"
    - key: "PYTHONUNBUFFERED"
      value: "1"

commandTests:
  - name: "bazarr help"
    command: "bazarr"
    args: ["--help"]
    expectedOutput: ["--no-update", "--config"]

  - name: "tini version"
    command: "tini"
    args: ["--version"]
    expectedOutput: ["tini version"]

fileExistenceTests:
  - name: "/config exists"
    path: "/config"
    shouldExist: true
    uid: 65532
    gid: 65532
    permissions: "drwxr-xr-x"

  - name: "/home/nonroot exists"
    path: "/home/nonroot"
    shouldExist: true
    uid: 65532
    gid: 65532
    permissions: "drwxr-xr-x"

  - name: "/tmp exists"
    path: "/tmp"
    shouldExist: true
