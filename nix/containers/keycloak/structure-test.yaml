# yaml-language-server: $schema=https://json.schemastore.org/container-structure-test.json
schemaVersion: "2.0.0"

metadataTest:
  user: "65532:65532"
  workdir: "/opt/keycloak"
  entrypoint: ["/opt/keycloak/bin/kc.sh"]
  cmd: ["start", "--optimized"]
  exposedPorts: ["8080", "8443", "9000"]

commandTests:
  - name: "keycloak version"
    command: "/opt/keycloak/bin/kc.sh"
    args: ["--version"]
    expectedOutput: ["Keycloak "]

  - name: "keycloak help"
    command: "/opt/keycloak/bin/kc.sh"
    args: ["--help"]
    expectedOutput: ["Usage:"]

fileExistenceTests:
  - name: "/opt/keycloak/conf exists"
    path: "/opt/keycloak/conf"
    shouldExist: true
    uid: 65532
    gid: 65532
    permissions: "drwxr-xr-x"

  - name: "/opt/keycloak/data exists"
    path: "/opt/keycloak/data"
    shouldExist: true
    uid: 65532
    gid: 65532
    permissions: "drwxr-xr-x"

  - name: "/opt/keycloak/providers exists"
    path: "/opt/keycloak/providers"
    shouldExist: true
    uid: 65532
    gid: 65532
    permissions: "drwxr-xr-x"

  - name: "/opt/keycloak/themes exists"
    path: "/opt/keycloak/themes"
    shouldExist: true
    uid: 65532
    gid: 65532
    permissions: "drwxr-xr-x"

  - name: "/tmp exists"
    path: "/tmp"
    shouldExist: true
