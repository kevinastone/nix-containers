# yaml-language-server: $schema=https://json.schemastore.org/container-structure-test.json
schemaVersion: "2.0.0"

metadataTest:
  exposedPorts: ["8080", "6881"]
  envVars:
    - key: "QBT_CONFIRM_LEGAL_NOTICE"
      value: "1"
    - key: "HOME"
      value: "/config"
    - key: "XDG_CONFIG_HOME"
      value: "/config"
    - key: "XDG_DATA_HOME"
      value: "/config"

commandTests:
  - name: "qbittorrent-nox version"
    command: "qbittorrent-nox"
    args: ["--version"]
    expectedOutput: ["qBittorrent v"]
