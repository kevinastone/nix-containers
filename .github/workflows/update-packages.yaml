# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Update Custom Packages

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # Weekly on Monday at 05:23 UTC (after Renovate flake.lock window)

permissions:
  contents: read

concurrency:
  group: update-packages
  cancel-in-progress: true

jobs:
  update-packages:
    name: Update Custom Packages
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Update custom packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run .#update-packages

      - name: Open or update Pull Request
        uses: ./.github/actions/open-update-pr
        with:
          branch: chore/update-packages
          paths: nix/
          title: "chore(deps): update custom packages"
          report-title: "Automated custom package update."
