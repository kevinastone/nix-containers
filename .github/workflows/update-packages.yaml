# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Update Packages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Weekly on Monday at 00:00 UTC

permissions:
  contents: read

concurrency:
  group: update-packages
  cancel-in-progress: true

jobs:
  update-packages:
    name: Update Flake Inputs & Custom Packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_changes: ${{ steps.report.outputs.has_changes }}
      matrix: ${{ steps.report.outputs.matrix }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Checkout # zizmor: ignore[artipacked] -- git push to PR branch requires persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Update flake.lock and custom packages
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix flake update
          nix run .#update-packages
          if git diff --quiet flake.lock nix/; then
            echo "No updates available."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Nix checks
        if: steps.update.outputs.updated == 'true'
        run: nix flake check -L

      - name: Generate changelog report
        id: report
        if: steps.update.outputs.updated == 'true'
        run: |
          git worktree add --detach /tmp/before HEAD
          nix run .#flake-update-report -- \
            /tmp/before . \
            --body-file /tmp/pr-body.md \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Open or update Pull Request
        id: pr
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="chore/update-packages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add flake.lock nix/
          git commit -m "chore(deps): update flake.lock and packages"
          git push --force origin "$branch"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --title "chore(deps): update flake.lock and packages" --body-file /tmp/pr-body.md
          else
            gh pr create --base main --head "$branch" --title "chore(deps): update flake.lock and packages" --body-file /tmp/pr-body.md
          fi

  build:
    name: ${{ matrix.container }}
    needs: [update-packages]
    if: needs.update-packages.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.update-packages.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yaml
    with:
      ref: ${{ needs.update-packages.outputs.sha }}
      container: ${{ matrix.container }}
      arches_json: ${{ toJson(matrix.arches) }}
