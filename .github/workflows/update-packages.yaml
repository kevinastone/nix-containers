# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Update Custom Packages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Weekly on Monday at 00:00 UTC

permissions:
  contents: read

concurrency:
  group: update-packages
  cancel-in-progress: true

jobs:
  update-packages:
    name: Update Custom Packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout # zizmor: ignore[artipacked] -- git push to PR branch requires persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Update custom packages
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix run .#update-packages
          if git diff --quiet nix/; then
            echo "No custom package updates available."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update Pull Request
        if: steps.update.outputs.updated == 'true'
        uses: ./.github/actions/open-update-pr
        with:
          branch: chore/update-packages
          paths: nix/
          title: "chore(deps): update custom packages"
          report-title: "Automated custom package update."
