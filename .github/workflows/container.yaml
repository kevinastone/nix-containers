# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Container Pipeline

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      container:
        type: string
        required: true
      version:
        type: string
        required: true
      arches_json:
        type: string
        required: true
      drvs_json:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.arches_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.arch }}-${{ inputs.container }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.arch }}-${{ inputs.container }}-

      - name: Build ${{ inputs.container }} (${{ matrix.arch }}) image
        run: nix build ".#${{ inputs.container }}" --out-link result -L

      - name: Smoke test ${{ inputs.container }} (${{ matrix.arch }})
        run: nix run ".#${{ inputs.container }}.test" -- result

      - name: Prepare ${{ inputs.container }} (${{ matrix.arch }}) artifact
        if: github.event_name != 'pull_request'
        run: cp -L result "${{ matrix.arch }}.tar.gz"

      - name: Upload ${{ inputs.container }} (${{ matrix.arch }}) artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ inputs.container }}-${{ matrix.arch }}
          path: ${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  push:
    name: Push
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.arch }}-ci-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.arch }}-ci-

      - name: Download image artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: image-${{ inputs.container }}-*
          path: artifacts
          merge-multiple: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.container }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ inputs.version }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬆️ Push Image to GHCR
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          DRVS_JSON: ${{ inputs.drvs_json }}
        run: |
          ARGS=()
          for tar in artifacts/*.tar.gz; do
            ARGS+=("linux/$(basename "$tar" .tar.gz)=${tar}")
          done
          nix run .#push-multiarch -- "ghcr.io/${{ github.repository }}/${{ inputs.container }}" "${ARGS[@]}" --github-output "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.4

      - name: Sign multi-arch OCI index
        run: cosign sign --yes "${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
