# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      container:
        type: string
        required: true
      arches_json:
        type: string
        required: true
      upload_artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.arches_json) }}
    env:
      CONTAINER: ${{ inputs.container }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Build ${{ inputs.container }} (${{ matrix.arch }}) image
        run: nix build ".#${CONTAINER}" --out-link result -L

      - name: Smoke test ${{ inputs.container }} (${{ matrix.arch }})
        run: nix run ".#${CONTAINER}.test" -- result

      - name: Inspect ${{ inputs.container }} (${{ matrix.arch }})
        run: |
          BASE_ARGS=()
          if git fetch --no-tags --depth=1 origin main 2>/dev/null; then
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
              git worktree add --detach /tmp/base FETCH_HEAD
              BASE_ARGS+=(--base-dir /tmp/base)
            fi
          fi
          nix run .#inspect-image -- result --container "$CONTAINER" --arch "$ARCH" "${BASE_ARGS[@]}"

      - name: Generate SBOM and scan ${{ inputs.container }} (${{ matrix.arch }})
        run: nix run .#scan-image -- result --label "${CONTAINER} (${ARCH})" --sbom-output "${ARCH}.spdx.json"

      - name: Prepare ${{ inputs.container }} (${{ matrix.arch }}) artifact
        if: inputs.upload_artifacts
        run: cp -L result "${ARCH}.tar.gz"

      - name: Upload ${{ inputs.container }} (${{ matrix.arch }}) artifact
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ inputs.container }}-${{ matrix.arch }}
          path: |
            ${{ matrix.arch }}.tar.gz
            ${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 1
