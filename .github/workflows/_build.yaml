# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  workflow_call:
    inputs:
      container:
        type: string
        required: true
      arches_json:
        type: string
        required: true
      upload_artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.arches_json) }}
    env:
      CONTAINER: ${{ inputs.container }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Stream ${{ inputs.container }} (${{ matrix.arch }}) image archive
        run: |
          nix build ".#${CONTAINER}.streamArchive" --out-link stream-archive -L
          ./stream-archive > "${ARCH}.tar.gz"

      - name: Smoke test ${{ inputs.container }} (${{ matrix.arch }})
        run: nix run ".#${CONTAINER}.test" -- "${ARCH}.tar.gz"

      - name: Inspect ${{ inputs.container }} (${{ matrix.arch }})
        run: nix run .#inspect-image -- "${ARCH}.tar.gz" --container "$CONTAINER" --arch "$ARCH" --base-ref origin/main

      - name: Generate SBOM and scan ${{ inputs.container }} (${{ matrix.arch }})
        run: nix run .#scan-image -- "${ARCH}.tar.gz" --label "${CONTAINER} (${ARCH})" --sbom-output "${ARCH}.spdx.json"

      - name: Upload ${{ inputs.container }} (${{ matrix.arch }}) artifact
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ inputs.container }}-${{ matrix.arch }}
          path: |
            ${{ matrix.arch }}.tar.gz
            ${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 1
