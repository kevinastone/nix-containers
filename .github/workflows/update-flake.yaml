# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Weekly on Monday at 00:00 UTC

permissions:
  contents: read

concurrency:
  group: update-flake
  cancel-in-progress: true

jobs:
  update-flake:
    name: Update Nix Flake Inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_changes: ${{ steps.pr.outputs.has_changes }}
      matrix: ${{ steps.pr.outputs.matrix }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Checkout # zizmor: ignore[artipacked] -- git push to PR branch requires persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Update flake.lock
        id: update
        run: |
          nix flake update
          if git diff --quiet flake.lock; then
            echo "No flake.lock updates available."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update Pull Request
        id: pr
        if: steps.update.outputs.updated == 'true'
        uses: ./.github/actions/open-update-pr
        with:
          branch: chore/update-flake-lock
          paths: flake.lock
          title: "chore(deps): update flake.lock"
          report-title: "Automated `flake.lock` update."

  build:
    name: ${{ matrix.container }}
    needs: [update-flake]
    if: needs.update-flake.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.update-flake.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yaml
    with:
      ref: ${{ needs.update-flake.outputs.sha }}
      container: ${{ matrix.container }}
      arches_json: ${{ toJson(matrix.arches) }}
