# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish

on:
  workflow_call:
    inputs:
      container:
        type: string
        required: true
      tags_json:
        type: string
        required: true
      arches_json:
        type: string
        required: true
      drvs_json:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yaml
    with:
      container: ${{ inputs.container }}
      arches_json: ${{ inputs.arches_json }}
      upload_artifacts: true

  push:
    name: Push
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Download image artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-${{ inputs.container }}--*
          path: artifacts
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Stage multi-arch OCI index by digest
        id: stage
        env:
          DRVS_JSON: ${{ inputs.drvs_json }}
          IMAGE_REPO: ghcr.io/${{ github.repository }}/${{ inputs.container }}
          REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: nix run .#push-multiarch -- stage "$IMAGE_REPO" --artifacts-dir artifacts --github-output "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign multi-arch OCI index
        env:
          IMAGE_REF: ${{ steps.stage.outputs.repo }}@${{ steps.stage.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.stage.outputs.repo }}
          subject-digest: ${{ steps.stage.outputs.digest }}
          push-to-registry: true

      - name: Attest amd64 SBOM
        if: steps.stage.outputs.amd64_digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.stage.outputs.repo }}
          subject-digest: ${{ steps.stage.outputs.amd64_digest }}
          sbom-path: artifacts/amd64.spdx.json
          push-to-registry: true

      - name: Attest arm64 SBOM
        if: steps.stage.outputs.arm64_digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.stage.outputs.repo }}
          subject-digest: ${{ steps.stage.outputs.arm64_digest }}
          sbom-path: artifacts/arm64.spdx.json
          push-to-registry: true

      - name: Promote mutable tags
        env:
          DIGEST: ${{ steps.stage.outputs.digest }}
          IMAGE_REPO: ${{ steps.stage.outputs.repo }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
          TAGS_JSON: ${{ inputs.tags_json }}
        run: |
          EXTRA_ARGS=()
          if [ "$IS_MAIN" = "true" ]; then
            EXTRA_ARGS+=(--include-main)
          fi
          nix run .#push-multiarch -- promote "$IMAGE_REPO" "$DIGEST" "${EXTRA_ARGS[@]}"
