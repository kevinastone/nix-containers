# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      container:
        type: string
        required: true
      version:
        type: string
        required: true
      arches_json:
        type: string
        required: true
      drvs_json:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build.yaml
    with:
      ref: ${{ inputs.ref }}
      container: ${{ inputs.container }}
      arches_json: ${{ inputs.arches_json }}
      upload_artifacts: true

  push:
    name: Push
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Download image artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-${{ inputs.container }}-*
          path: artifacts
          merge-multiple: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.container }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ inputs.version }}

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: ⬆️ Push Image to GHCR
        id: push
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}/${{ inputs.container }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          DRVS_JSON: ${{ inputs.drvs_json }}
        run: |
          ARGS=()
          for tar in artifacts/*.tar.gz; do
            ARGS+=("linux/$(basename "$tar" .tar.gz)=${tar}")
          done
          nix run .#push-multiarch -- "$IMAGE_REPO" "${ARGS[@]}" --github-output "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign multi-arch OCI index
        env:
          IMAGE_REF: ${{ steps.push.outputs.repo }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
