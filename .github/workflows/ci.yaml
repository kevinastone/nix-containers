# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild and push all containers even if unchanged"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_changes: ${{ steps.discover.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and discover changed containers
        id: discover
        uses: ./.github/actions/test-and-discover
        with:
          force: ${{ inputs.force }}

  publish:
    name: ${{ matrix.container }}
    needs: [test]
    if: needs.test.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.test.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_publish.yaml
    with:
      container: ${{ matrix.container }}
      tags_json: ${{ toJson(matrix.tags) }}
      arches_json: ${{ toJson(matrix.arches) }}
      drvs_json: ${{ toJson(matrix.drvs) }}
