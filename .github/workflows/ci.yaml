# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild and push all containers even if unchanged"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_changes: ${{ steps.discover.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Run Nix checks
        run: nix flake check -L

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Discover changed containers
        id: discover
        env:
          REPO: ghcr.io/${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          CI_JSON=$(nix eval --json .#lib.ci)
          EXTRA_ARGS=()
          if [ "$FORCE" = "true" ]; then
            EXTRA_ARGS+=(--force)
          fi
          nix run .#ci-matrix -- "$REPO" "$CI_JSON" --github-output "$GITHUB_OUTPUT" "${EXTRA_ARGS[@]}"

  build:
    name: ${{ matrix.container }}
    needs: [test]
    if: needs.test.outputs.has_changes == 'true' && github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.test.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yaml
    with:
      ref: ${{ inputs.ref }}
      container: ${{ matrix.container }}
      arches_json: ${{ toJson(matrix.arches) }}

  publish:
    name: ${{ matrix.container }}
    needs: [test]
    if: needs.test.outputs.has_changes == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.test.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_publish.yaml
    with:
      ref: ${{ inputs.ref }}
      container: ${{ matrix.container }}
      version: ${{ matrix.version }}
      extra_tags_json: ${{ toJson(matrix.extraTags) }}
      arches_json: ${{ toJson(matrix.arches) }}
      drvs_json: ${{ toJson(matrix.drvs) }}
