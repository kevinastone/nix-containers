# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.discover.outputs.build_matrix }}
      push_matrix: ${{ steps.discover.outputs.push_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - &cache-nix-store
        name: Cache Nix Store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: ${{ runner.os }}-nix-${{ hashFiles('flake.lock') }}

      - name: Run Nix checks
        run: nix flake check -L

      - name: Discover containers
        id: discover
        run: |
          echo "build_matrix=$(nix eval --json .#lib.ci.build | jq -c)" >> "$GITHUB_OUTPUT"
          echo "push_matrix=$(nix eval --json .#lib.ci.push | jq -c)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.container }} (${{ matrix.arch }})
    needs: [test]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.test.outputs.build_matrix) }}
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main')) ||
      github.event_name == 'workflow_call'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - *cache-nix-store

      - name: Build ${{ matrix.container }} (${{ matrix.arch }}) image
        run: |
          nix build ".#${{ matrix.container }}" --out-link "result-${{ matrix.container }}-${{ matrix.arch }}" -L
          cp -L "result-${{ matrix.container }}-${{ matrix.arch }}" "result-${{ matrix.container }}-${{ matrix.arch }}.tar.gz"

      - name: Upload ${{ matrix.container }} (${{ matrix.arch }}) artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.container }}-${{ matrix.arch }}
          path: result-${{ matrix.container }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  push-multiarch:
    name: Push ${{ matrix.container }} Image
    needs: [test, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.test.outputs.push_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - *cache-nix-store

      - name: Download image artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: image-${{ matrix.container }}-*
          path: artifacts
          merge-multiple: true

      - name: Get ${{ matrix.container }} version
        id: version
        run: echo "version=$(nix eval --raw ".#packages.${{ matrix.system }}.${{ matrix.container }}.imageTag")" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.container }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬆️ Push Image to GHCR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          ARCHES: ${{ join(matrix.arches, ' ') }}
        run: |
          IMAGE_ARGS=()
          for arch in $ARCHES; do
            IMAGE_ARGS+=("linux/${arch}=artifacts/result-${{ matrix.container }}-${arch}.tar.gz")
          done
          nix run .#push-multiarch -- "ghcr.io/${{ github.repository }}/${{ matrix.container }}" "${IMAGE_ARGS[@]}"
