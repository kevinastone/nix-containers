# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    outputs:
      containers: ${{ steps.discover.outputs.containers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - &cache-nix-store
        name: Cache Nix Store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: ${{ runner.os }}-nix-${{ hashFiles('flake.lock') }}

      - name: Run Nix checks
        run: nix flake check -L

      - name: Discover containers
        id: discover
        run: echo "containers=$(nix eval --json .#lib.x86_64-linux.containers | jq -c)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.container }} (${{ matrix.arch }})
    needs: [test]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.test.outputs.containers) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main'))
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - *cache-nix-store

      - name: Build ${{ matrix.container }} (${{ matrix.arch }}) image
        run: |
          nix build ".#${{ matrix.container }}" --out-link "result-${{ matrix.container }}-${{ matrix.arch }}" -L
          cp -L "result-${{ matrix.container }}-${{ matrix.arch }}" "result-${{ matrix.container }}-${{ matrix.arch }}.tar.gz"

      - name: Upload ${{ matrix.container }} (${{ matrix.arch }}) artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.container }}-${{ matrix.arch }}
          path: result-${{ matrix.container }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  push-multiarch:
    name: Push ${{ matrix.container }} Multi-Arch Image
    needs: [test, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.test.outputs.containers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - *cache-nix-store

      - name: Download AMD64 artifact
        uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.container }}-amd64
          path: artifacts-amd64

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.container }}-arm64
          path: artifacts-arm64

      - name: Get ${{ matrix.container }} version
        id: version
        run: echo "version=$(nix eval --raw ".#${{ matrix.container }}.imageTag")" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.container }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬆️ Push Multi-Arch Image to GHCR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          nix run .#push-multiarch -- "ghcr.io/${{ github.repository }}/${{ matrix.container }}" "artifacts-amd64/result-${{ matrix.container }}-amd64.tar.gz" "artifacts-arm64/result-${{ matrix.container }}-arm64.tar.gz"
