# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild and push all containers even if unchanged"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_changes: ${{ steps.discover.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.arch }}-ci-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.arch }}-ci-

      - name: Run Nix checks
        run: nix flake check -L

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Discover changed containers
        id: discover
        run: |
          CI_JSON=$(nix eval --json .#lib.ci)
          nix run .#ci-matrix -- "ghcr.io/${{ github.repository }}" "$CI_JSON" --github-output "$GITHUB_OUTPUT" ${{ inputs.force && '--force' || '' }}

  container:
    name: ${{ matrix.container }}
    needs: [test]
    if: needs.test.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.test.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/container.yaml
    with:
      ref: ${{ inputs.ref }}
      container: ${{ matrix.container }}
      version: ${{ matrix.version }}
      arches_json: ${{ toJson(matrix.arches) }}
      drvs_json: ${{ toJson(matrix.drvs) }}
    secrets: inherit
