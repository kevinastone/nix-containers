# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Open Update PR
description: Validate changes, render an nvd changelog, and open or update a pull request

inputs:
  branch:
    description: Branch name for the update PR
    required: true
  paths:
    description: Space-separated file or directory paths to stage
    required: true
  title:
    description: Commit message and pull request title
    required: true
  report-title:
    description: Header line for flake-update-report
    required: true
  app-id:
    description: Optional GitHub App ID used to mint a short-lived installation token
    required: false
    default: ""
  app-private-key:
    description: Optional GitHub App private key PEM paired with app-id
    required: false
    default: ""
  token:
    description: Fallback GitHub token when app-id is not provided
    required: false
    default: ${{ github.token }}
  git-user-name:
    description: Git author/committer name for the automated commit
    required: false
    default: "github-actions[bot]"
  git-user-email:
    description: Git author/committer email for the automated commit
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"

runs:
  using: composite
  steps:
    - name: Check for modified paths
      id: changes
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
      run: |
        read -ra paths <<< "$PATHS"
        if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
          echo "No updates available in: ${PATHS}"
          echo "updated=false" >> "$GITHUB_OUTPUT"
        else
          echo "updated=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Run Nix checks
      if: steps.changes.outputs.updated == 'true'
      shell: bash
      run: nix flake check -L

    - name: Generate changelog report
      if: steps.changes.outputs.updated == 'true'
      shell: bash
      env:
        REPORT_TITLE: ${{ inputs.report-title }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        nix run .#flake-update-report -- \
          --base-ref HEAD \
          --title "$REPORT_TITLE" \
          --body-file /tmp/pr-body.md \
          --run-url "$RUN_URL"

    - name: Mint GitHub App token
      id: app-token
      if: steps.changes.outputs.updated == 'true' && inputs.app-id != ''
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-contents: write
        permission-pull-requests: write

    - name: Open or update Pull Request
      if: steps.changes.outputs.updated == 'true'
      shell: bash
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        BRANCH: ${{ inputs.branch }}
        GH_TOKEN: ${{ steps.app-token.outputs.token || inputs.token }}
        GIT_AUTHOR_EMAIL: ${{ inputs.git-user-email }}
        GIT_AUTHOR_NAME: ${{ inputs.git-user-name }}
        PATHS: ${{ inputs.paths }}
        TITLE: ${{ inputs.title }}
      run: |
        read -ra paths <<< "$PATHS"
        if [ -n "$APP_SLUG" ]; then
          BOT_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          GIT_AUTHOR_NAME="${APP_SLUG}[bot]"
          GIT_AUTHOR_EMAIL="${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
        fi
        gh auth setup-git
        git config user.name "$GIT_AUTHOR_NAME"
        git config user.email "$GIT_AUTHOR_EMAIL"
        git checkout -B "$BRANCH"
        git add -- "${paths[@]}" README.md
        git commit -m "$TITLE"
        git push --force origin "$BRANCH"

        if gh pr view "$BRANCH" >/dev/null 2>&1; then
          gh pr edit "$BRANCH" --title "$TITLE" --body-file /tmp/pr-body.md
        else
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file /tmp/pr-body.md
        fi
