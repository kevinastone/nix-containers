# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup Nix
description: Install Determinate Nix and configure Magic Nix Cache

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3
      with:
        summarize: false

    - name: Setup Magic Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
