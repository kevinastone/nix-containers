# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup Nix
description: Install Nix and configure Magic Nix Cache

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        github_access_token: ${{ github.token }}

    - name: Setup Magic Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
